<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Clean warm cream background -->
  <rect width="100" height="100" rx="24" fill="#EDE7DC"/>
  
  <!-- 'B' letter in the back -->
  <text
    x="42"
    y="70"
    font-size="64"
    font-family="'Georgia', serif"
    font-weight="600"
    fill="#1A1A1A"
  >B</text>
  
  <!-- 'S' letter stroke (cutout effect) -->
  <text
    x="22"
    y="66"
    font-size="68"
    font-family="'Georgia', serif"
    font-weight="300"
    fill="none"
    stroke="#EDE7DC"
    stroke-width="6"
  >S</text>

  {/* 'S' letter fill in the front */}
  <text
    x="22"
    y="66"
    font-size="68"
    font-family="'Georgia', serif"
    font-weight="300"
    fill="#C1440E"
  >S</text>
</svg>