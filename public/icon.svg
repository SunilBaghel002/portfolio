<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="monogramGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B38728" />
      <stop offset="25%" stop-color="#FBF5B7" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="monogramSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#000000" stroke="url(#monogramGold)" stroke-width="1"/>
  
  {/* 'B' letter in the background - Gold */}
  <text
    x="44"
    y="68"
    font-size="52"
    font-family="'Times New Roman', Georgia, serif"
    font-weight="400"
    fill="url(#monogramGold)"
    letter-spacing="-0.05em"
  >B</text>

  {/* 'S' letter in the foreground - Silver/White */}
  <text
    x="28"
    y="56"
    font-size="58"
    font-family="'Times New Roman', Georgia, serif"
    font-weight="300"
    fill="url(#monogramSilver)"
    letter-spacing="-0.05em"
  >S</text>
</svg>